apiVersion: v1
kind: Secret
metadata:
  name: app-env
type: Opaque
stringData:
  POSTGRES_USER: postgres_admin
  POSTGRES_PASSWORD: ...
  POSTGRES_DB: cloud_db
  DATABASE_URL: postgresql+asyncpg://postgres_admin:...@db:5432/cloud_db
  REDIS_URL: redis://redis:6379
  STORAGE_DISKS: disk1
  STORAGE_ROOT: /storage
  JWT_SECRET: ...
  SESSION_TTL_SECONDS: "86400"
  PRIVATE_SESSION_TTL_HOURS: "4"
  PHOTO_BATCH_SIZE: "30"
  THUMBNAIL_MAX_PX: "400"
  STRANGER_QUOTA_MB: "100"
  ARCHIVE_DAYS_THRESHOLD: "10"
  DISK_STRATEGY: most_free_space
  DISK_SPACE_CACHE_TTL: "30"
  MIN_FREE_SPACE_MB: "500"
  GOOGLE_CLIENT_ID: ...
  GOOGLE_CLIENT_SECRET: ...
  GOOGLE_REDIRECT_URI: http://filenkov.store:8000/api/auth/google/callback
  FRONTEND_URL: http://filenkov.store
  ADMIN_EMAIL: fad80223@gmail.com
  ADMIN_PASSWORD: ...
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-env
data:
  API_PROXY_TARGET: http://app:8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests: 
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: app-env
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "webstorage"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: pg-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: webstorage-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: storage-disk1
              mountPath: /storage/disk1
          envFrom:
            - secretRef:
                name: app-env
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: storage-disk1
          hostPath:
            path: /run/media/aleksey/HardDisk/storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: webstorage-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5173
          envFrom:
            - configMapRef:
                name: frontend-env
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: app
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  type: NodePort
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30573
