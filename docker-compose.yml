services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    # Gateway reaches app:8000 on auth_network. Do not publish :8000 as a second public edge.
    networks:
      - default
      - common_network
      - user_network
      - auth_network
    volumes:
      - ./backend:/app

  # Local Vite only. Production SPA is served by app (single gateway upstream).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env
    networks:
      - default

# Common (postgres, redis, minio) is already up in another project. Do not start it here.
# User-Service compose creates user_network. Auth-Service compose creates AUTH_DOCKER_NETWORK.
# From Auth-Service/deploy → deploy_auth; from the Auth-Service repo root → auth-service_auth.
networks:
  default: {}
  common_network:
    external: true
    name: common_network
  user_network:
    external: true
    name: user_network
  auth_network:
    external: true
    name: ${AUTH_DOCKER_NETWORK:-deploy_auth}
